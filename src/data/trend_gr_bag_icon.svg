<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="title desc">
  <title id="title">Shopping bag icon</title>
  <desc id="desc">A stylized purple shopping bag with a green four-point sparkle.</desc>
  <defs>
    <linearGradient id="bagPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A1BA8"/>
      <stop offset="1" stop-color="#510078"/>
    </linearGradient>
    <linearGradient id="handlePurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8517A7"/>
      <stop offset="1" stop-color="#610087"/>
    </linearGradient>
  </defs>

  <!-- Rounded shopping-bag handle -->
  <path d="M35 48V32c0-13.4 8.8-22.5 20-22.5S75 18.6 75 32v9"
        fill="none" stroke="url(#handlePurple)" stroke-width="7.5"
        stroke-linecap="round"/>

  <!-- Stylized bag body -->
  <path d="M20 44h57c-.5 12.8-5.8 19.9-19.1 25.6
           15.1 6.4 23.2 16.4 25.8 34.1
           -14.8-10.8-28.7-19.9-44.6-26.2
           C23.8 72.4 14.6 65.2 14.6 55.7
           14.6 50.8 16.5 47.1 20 44Z"
        fill="url(#bagPurple)"/>

  <!-- Four-point sparkle -->
  <path d="M79 39
           C82.7 54.8 88.7 60.8 105 65
           C88.7 69.2 82.7 75.2 79 91
           C75.3 75.2 69.3 69.2 53 65
           C69.3 60.8 75.3 54.8 79 39Z"
        fill="#8ACB20"/>
</svg>
